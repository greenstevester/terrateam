<!DOCTYPE html><html><head><style>
html { background: #0B1622; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; background-image: url('bg-dark.png'); background-size: cover; }
.wrap { margin: 0; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.accent { margin: 0 auto 18pt auto; }
h1 { color: #FFFFFF; font-size: 36pt; margin: 0 0 6pt 0; text-align: center; letter-spacing: 1pt; }
h2 { color: #17A2B8; font-size: 16pt; margin: 0 0 30pt 0; text-align: center; font-weight: normal; }
.meta { display: flex; gap: 40pt; margin: 0 auto; }
.stat { text-align: center; }
.stat p { margin: 0; }
.stat .num { color: #17A2B8; font-size: 28pt; font-weight: bold; font-family: 'Courier New', monospace; }
.stat .lbl { color: #8899AA; font-size: 10pt; text-transform: uppercase; letter-spacing: 1pt; }
.foot { margin-top: 30pt; }
.foot p { color: #556677; font-size: 9pt; margin: 0; text-align: center; }
</style></head><body>
<div class="wrap">
  <img class="accent" src="accent-teal.png" style="width: 60pt; height: 3pt;">
  <h1>Terrateam Behavioral<br>Changes Report</h1>
  <h2>January 2025 — February 2026</h2>
  <div class="meta">
    <div class="stat"><p class="num">1,407</p><p class="lbl">Commits</p></div>
    <div class="stat"><p class="num">428</p><p class="lbl">Merged PRs</p></div>
    <div class="stat"><p class="num">6.5</p><p class="lbl">Month Rewrite</p></div>
    <div class="stat"><p class="num">6</p><p class="lbl">Rollback Cycles</p></div>
  </div>
  <div class="foot"><p>Generated 2026-02-19 from git history analysis</p></div>
</div>
</body></html>
